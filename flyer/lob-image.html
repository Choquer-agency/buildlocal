<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Build Local — 6x9 (pre-rendered image)</title>
<style>
  * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
  html, body { width: 9.25in; height: 6.25in; overflow: hidden; }
  /* Full-bleed pre-rendered flyer image. Fonts + layout are baked in, so Lob
     just prints the image — nothing to load, nothing to overflow. On the FRONT,
     the image already contains the blank address zone; Lob overlays the address
     on top of it. */
  img { display: block; width: 9.25in; height: 6.25in; }
</style>
</head>
<body>
  <img src="{{flyer_image}}" alt="">
</body>
</html>
