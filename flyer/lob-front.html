  /* === LOB 6x9 POSTCARD — full bleed 9.25in x 6.25in === */
  body {
    position: relative; width: 9.25in; height: 6.25in; margin: 0; padding: 0;
    background: #F2913B;
    font-family: 'PP Neue Montreal', Arial, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden;
  }
  #safe { position: absolute; left: 0.1875in; top: 0.1875in; width: 8.875in; height: 5.875in; }

  /* --- Logo top-left (black SVG flipped white) --- */
  .logo { position: absolute; left: 0; top: 0.05in; height: 0.42in; filter: brightness(0) invert(1); }

  /* --- Contact top-right --- */
  .contact { position: absolute; right: 0; top: 0.04in; text-align: right; font-style: italic; font-weight: 600; color: #000; font-size: 16px; line-height: 1.42; }

  /* --- Headline: 3 rows, ONE uniform size (scales down only for long names) --- */
  .headline { position: absolute; left: -1px; top: 1.0in; font-style: italic; font-weight: 600; color: #000; letter-spacing: -1px; font-size: {{headline_font}}px; line-height: 0.99; }
  .headline .row { display: block; white-space: nowrap; }
  /* highlighted "website" — yellow angled box (parallelogram); text keeps the same italic lean as the rows above */
  .headline .hl { display: inline-block; position: relative; padding: 0 0.14in 0.03in; margin-top: 0.03in; }
  .headline .hl:before { content:''; position:absolute; inset:0; background:#FCE34A; transform: skewX(-11deg); z-index:-1; }

  /* --- Scan CTA bottom-left --- */
  .cta { position: absolute; left: 0; bottom: 0.16in; width: 2.95in; }
  .cta .kicker { font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:15px; letter-spacing:0.5px; text-transform:uppercase; color:#000; margin-bottom:0.07in; }
  .cta .big { font-style: italic; font-weight: 600; font-size: 52px; line-height: 0.77; color:#000; letter-spacing:-1px; }
  .cta .peace { display:inline-flex; align-items:center; vertical-align:-0.14in; margin:0 0.04in; }
  .cta .peace img { height:0.6in; display:block; }

  /* QR — centered in the lane between the CTA text and the ink-free zone, with
     equal orange margin on both sides (CTA ends ~2.95in, ink-free starts 4.975in) */
  .qr { position: absolute; left: 2.815in; bottom: 0.2in; width: 1.55in; height: 1.55in; background:#fff; padding:0.06in; }
  .qr img { width:100%; height:100%; display:block; }

  /* === INK-FREE — Lob prints recipient address + postage here. LEAVE BLANK. === */
  #ink-free { position: absolute; right: 0.275in; bottom: 0.25in; width: 4in; height: 2.375in; background:#fff; }
</style>
</head>
<body>
  <div id="safe">
    <img class="logo" src="https://demo.buildlocal.agency/m/logo.svg" alt="Build Local . Agency">

    <div class="contact">
      Build Local Agency<br>
      (480) 680-9076<br>
      hello@buildlocal.agency
    </div>

    <div class="headline">
      <span class="row">{{business_name}}</span>
      <span class="row">{{deserves_line}}</span>
      <span class="row"><span class="hl">website</span></span>
    </div>

    <div class="cta">
      <div class="kicker">we built your website...</div>
      <div class="big">Scan to <span class="peace"><img src="https://demo.buildlocal.agency/m/peace.svg" alt=""></span><br>see yours!</div>
    </div>

    <div class="qr"><img src="{{qr_image_url}}" alt="Scan to see your new site"></div>
  </div>

  <div id="ink-free"></div>
</body>
</html>
