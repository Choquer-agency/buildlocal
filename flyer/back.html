<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Build Local — 6x9 Before/After Side</title>
<style>
  *, *:before, *:after { -webkit-box-sizing: border-box; box-sizing: border-box; }

  @font-face { font-family:'PP Neue Montreal'; font-style:italic; font-weight:600; src:url('assets/fonts/ppneuemontreal-semibolditalic.otf') format('opentype'); font-display:block; }
  @font-face { font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; src:url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); font-display:block; }

  body {
    position: relative; width: 9.25in; height: 6.25in; margin: 0; padding: 0;
    background: #ffffff;
    font-family: 'PP Neue Montreal', Arial, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden;
  }
  #safe { position: absolute; left: 0.4in; top: 0.4in; width: 8.45in; height: 5.45in; }

  /* --- Header: full-width banner --- */
  .kicker { position: absolute; left: 0; top: 0; font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:15px; letter-spacing:0.5px; text-transform:uppercase; color:#000; }
  .head { position: absolute; left: -2px; top: 0.3in; width: 8.9in; white-space: nowrap; font-style: italic; font-weight: 600; font-size: 64px; line-height: 0.95; letter-spacing: -1.5px; color: #000; }

  /* --- OLD screenshot: landscape, upper-left --- */
  .old-wrap { position: absolute; left: 0in; top: 1.3in; width: 3.85in; }
  .old-wrap img { width: 100%; display: block; border: 0.05in solid #F2913B; box-shadow: 0 6px 16px rgba(0,0,0,0.22); }
  .tag-old { position: absolute; left: -0.05in; top: -0.28in; background:#FCE34A; color:#000; font-style:italic; font-weight:600; font-size:34px; padding:0.02in 0.2in 0.05in; box-shadow:0 3px 8px rgba(0,0,0,0.18); z-index:5; }

  /* --- Arrow Old -> New --- */
  .arrow { position: absolute; left: 3.95in; top: 1.85in; font-family:'PP Neue Montreal'; font-style:italic; font-weight:600; font-size:120px; line-height:1; color:#F2913B; }

  /* --- NEW screenshot: tall portrait hero, right --- */
  .new-wrap { position: absolute; right: 0in; top: 1.05in; width: 3.75in; }
  .new-wrap img { width: 100%; display: block; border: 0.05in solid #F2913B; box-shadow: 0 8px 22px rgba(0,0,0,0.18); }
  .tag-new { position: absolute; left: -0.18in; top: 0.3in; background:#FCE34A; color:#000; font-style:italic; font-weight:600; font-size:34px; padding:0.02in 0.2in 0.05in; box-shadow:0 3px 8px rgba(0,0,0,0.18); z-index:5; }

  /* --- QR call-to-action panel, lower-left --- */
  .qrcta { position: absolute; left: -0.05in; top: 3.45in; width: 3.9in; display:flex; align-items:center; gap:0.14in; }
  .qrcta .qrbox { flex:none; width:1.45in; height:1.45in; background:#fff; padding:0; }
  .qrcta .qrbox img { width:100%; height:100%; display:block; }
  .qrcta .lbl { color:#000; font-style:italic; font-weight:600; font-size:26px; line-height:1.04; }
  .qrcta .lbl .y { color:#F2913B; }

  /* --- Contact bottom-left (single line, below the QR panel) --- */
  .contact { position: absolute; left: 0; bottom: 0.02in; font-style: italic; font-weight: 600; font-size: 13px; color: #000; }
</style>
</head>
<body>
  <div id="safe">
    <div class="kicker">So we went ahead and built it.</div>
    <div class="head">Scan to see your new website!</div>

    <!-- OLD: their current site (or no-website placeholder) -->
    <div class="old-wrap">
      <span class="tag-old">Old</span>
      <img src="{{old_shot_url}}" alt="Old website">
    </div>

    <div class="arrow">&rarr;</div>

    <!-- NEW: the site we built -->
    <div class="new-wrap">
      <span class="tag-new">New</span>
      <img src="{{new_shot_url}}" alt="New website">
    </div>

    <!-- QR call to action -->
    <div class="qrcta">
      <div class="qrbox"><img src="{{qr_image_url}}" alt="Scan to see your new site"></div>
      <div class="lbl"><span class="y">&larr;</span> Scan to explore<br>your new site <span class="y">live</span></div>
    </div>

    <div class="contact">Build Local Agency&nbsp;&nbsp;·&nbsp;&nbsp;(480) 680-9076&nbsp;&nbsp;·&nbsp;&nbsp;hello@buildlocal.agency</div>
  </div>
</body>
</html>
